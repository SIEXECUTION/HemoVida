    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" when external tools/scripts reassign window.fetch
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
            if (typeof Window !== 'undefined' && Window.prototype && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e) {}
            }
          }
        } catch (err) {
          console.warn('Fetch setter safeguard init error:', err);
        }
      })();
    </script>
