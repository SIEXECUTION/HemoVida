services:
  - type: web
    name: hemovida-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn hemovida_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    plan: free
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "hemovida-backend.onrender.com,localhost,127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: PAYMENT_FRONTEND_URL
        value: "https://hemovida-banco-de-sangre.siexecution2026.workers.dev"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hemovida-banco-de-sangre.siexecution2026.workers.dev"
      - key: SUPABASE_TRANSACTION_POOLER
        value: "True"
      - key: USE_SQLITE
        value: "False"
