# fly.toml app configuration file for Fly.io
# Refer to https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "hemovida-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
