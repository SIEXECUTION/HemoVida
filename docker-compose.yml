services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hemovida-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hemovida-oci-prod-2026}
    env_file:
      - .env
