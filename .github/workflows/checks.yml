name: Verificar HemoVida
on:
  push:
    branches: [main, codex/ciclo3-desarrollo-local]
  pull_request:
    branches: [main, codex/ciclo3-desarrollo-local]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://hemovida-backend.onrender.com/api
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      USE_SQLITE: 'True'
      DEBUG: 'False'
      SECRET_KEY: ci-only-placeholder-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test tests_cors tests_database_config --noinput
      - run: python manage.py collectstatic --noinput
